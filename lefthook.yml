pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner
    java:
      run: ./mvnw -B -ntp verify
commit-msg:
  commands:
    conventional:
      run: |
        head -1 {1} | grep -qE '^(feat|fix|refactor|perf|test|docs|build|ci|chore|style|revert)\([a-z0-9-]+\)!?: .{1,72}$' || exit 1
        sed -n '2,$p' {1} | grep -qE '[^[:space:]]' || exit 1
