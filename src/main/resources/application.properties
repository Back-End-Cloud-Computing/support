spring.application.name=support
server.port=${PORT:8090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
support.secret=${INTERNAL_SECRET:}
support.db-path=${DB_PATH:/data/support.db}
support.email-provider=${EMAIL_PROVIDER:smtp}
support.sms-provider=${SMS_PROVIDER:fake}
support.whatsapp-provider=${WHATSAPP_PROVIDER:fake}
support.smtp-from=${SMTP_FROM:no-reply@ganjj.local}
spring.mail.host=${SMTP_HOST:mailpit}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
logging.level.root=${LOG_LEVEL:info}
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics

spring.config.import=optional:file:.env[.properties]
logging.structured.format.console=logstash
