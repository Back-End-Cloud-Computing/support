apiVersion: apps/v1
kind: Deployment
metadata:
  name: support
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: support
  template:
    metadata:
      labels:
        app: support
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: support
          image: eduardofabri/support:1.0.2
          ports:
            - containerPort: 8090
          env:
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: support-credentials
                  key: internal-secret
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: support-credentials
                  key: amqp-url
                  optional: true
            - name: DB_PATH
              value: /data/support.db
            - name: SMTP_HOST
              value: mailpit
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: 8090
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /health/ready
              port: 8090
          livenessProbe:
            timeoutSeconds: 5
            httpGet:
              path: /health
              port: 8090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: support-data
---
apiVersion: v1
kind: Service
metadata:
  name: support
spec:
  selector:
    app: support
  ports:
    - port: 8090
      targetPort: 8090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: support-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
